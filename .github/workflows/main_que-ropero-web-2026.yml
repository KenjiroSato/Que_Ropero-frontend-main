# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Que Ropero to Azure

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: que-ropero-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run check

      - name: Test API
        run: npm run test:api

      - name: Test Angular
        run: npm run test:ci

      - name: Build Angular
        run: npm run build

      - name: Prepare production package
        run: |
          npm prune --omit=dev
          mkdir release
          cp -r api dist node_modules package.json package-lock.json release/
          tar -czf app.tar.gz -C release .

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: app.tar.gz
          retention-days: 3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Extract application
        run: |
          mkdir release
          tar -xzf app.tar.gz -C release

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6DAEA6E3E8AC4DADA270593BC6DDA072 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_39F3014A5C29404391809C0FBA5CB979 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6BBC4441A1C44579AAC28B6A5C4751E3 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: que-ropero-web-2026
          slot-name: Production
          package: release

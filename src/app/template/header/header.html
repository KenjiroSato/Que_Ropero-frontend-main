<header class="header" style="background: linear-gradient(90deg, #071e3d, #0f3460, #16213e); border-bottom: 2px solid #00d2ff;">
  <div class="header-container" style="flex-direction: row; justify-content: space-between; flex-wrap: wrap;">
    <!-- Logo Que Ropero -->
    <a routerLink="/" class="logo">
      <span style="font-size: 2.2rem;"></span>
      <div>
        <span style="color: #00d2ff; font-weight: 800; display: block; line-height: 1.1;">QUE ROPERO</span>
        <small style="color: #cbd5e1; font-size: 0.75rem;">Alquiler de Lavadoras • Itagüí</small>
      </div>
    </a>

    <!-- Navegación -->
    <nav class="nav" style="gap: 28px;">
      <a routerLink="/"> Inicio</a>
      <a routerLink="/productos">Catálogo de Lavadoras</a>
      <a routerLink="/compras"> Mis Alquileres / Carrito</a>

      <!-- SOLO VISIBLE PARA EL ROL ADMINISTRADOR -->
      <a *ngIf="esAdmin" routerLink="/usuarios" style="color: #ffd700; font-weight: bold;">
         Usuarios (BD)
      </a>

      <a *ngIf="!usuarioActual" routerLink="/login" style="background: #00d2ff; color: #071e3d; padding: 6px 16px; border-radius: 20px; font-weight: bold;">
        Iniciar Sesión
      </a>

      <div *ngIf="usuarioActual" style="display: flex; align-items: center; gap: 10px;">
        <span style="color: #00d2ff; font-size: 0.95rem;">
           {{ usuarioActual.nombre }}
        </span>
        <span [style.background]="esAdmin ? '#f59e0b' : '#1aaf5d'"
              style="color: #000; font-size: 0.72rem; font-weight: 800; padding: 2px 8px; border-radius: 10px; text-transform: uppercase;">
          {{ usuarioActual.tipoUsuario || 'Cliente' }}
        </span>
        <button (click)="salir()" style="background: #e11d48; color: #fff; border: none; padding: 5px 12px; border-radius: 15px; cursor: pointer; font-size: 0.85rem;">
          Cerrar Sesión
        </button>
      </div>
    </nav>
  </div>
</header>
